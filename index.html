<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe4" />
  <title>English Storybook</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">English Storybook</p>
        <h1 id="book-title">The Ugly Duckling</h1>
      </div>
      <span id="level-badge" class="level-badge">A2–B1</span>
    </header>

    <section class="reader-card" aria-live="polite">
      <div class="image-wrap">
        <img id="page-image" alt="" />
      </div>

      <article class="story-panel">
        <div class="page-meta">
          <span id="page-number">Cover</span>
          <span id="page-counter">1 / 11</span>
        </div>

        <h2 id="page-title"></h2>
        <div id="page-content" class="page-content"></div>
      </article>
    </section>

    <nav class="controls" aria-label="Book navigation">
      <button id="prev-btn" class="nav-btn secondary" type="button">← Previous</button>
      <button id="next-btn" class="nav-btn primary" type="button">Next →</button>
    </nav>
  </main>

  <div id="vocab-backdrop" class="vocab-backdrop" hidden></div>
  <aside id="vocab-popup" class="vocab-popup" aria-hidden="true">
    <button id="popup-close" class="popup-close" type="button" aria-label="Close">×</button>
    <p id="popup-word" class="popup-word"></p>
    <p id="popup-type" class="popup-type"></p>
    <p class="popup-label">Spanish</p>
    <p id="popup-translation" class="popup-translation"></p>
    <div id="popup-context-wrap">
      <p class="popup-label">In this story</p>
      <p id="popup-context" class="popup-context"></p>
    </div>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
